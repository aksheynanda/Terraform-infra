version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing Terraform..."
      - curl -o terraform.zip https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip
      - unzip terraform.zip
      - mv terraform /usr/local/bin/
      - terraform -version

  pre_build:
    commands:
      - echo "Initializing Terraform..."
      - terraform init

  build:
    commands:
      - echo "Running Terraform ${TF_ACTION}..."
      - |
        if [ "$TF_ACTION" = "plan" ]; then
          terraform plan -out=tfplan.out
        elif [ "$TF_ACTION" = "apply" ]; then
          terraform apply -auto-approve tfplan.out || terraform apply -auto-approve
        else
          echo "Invalid TF_ACTION value: $TF_ACTION" && exit 1
        fi

artifacts:
  files:
    - '**/*'
